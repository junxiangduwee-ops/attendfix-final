<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><link rel="icon" type="image/png" href="/favicon.png"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AttendFix — MR DIY</title>
<link rel="stylesheet" href="/css/app.css">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
.login-wrap{width:100%;max-width:400px;padding:24px}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo img{width:80px;height:80px;object-fit:contain;margin-bottom:12px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.15))}
.login-title{font-size:22px;font-weight:700;letter-spacing:-.3px;margin-bottom:4px;color:var(--text)}
.login-sub{font-size:13px;color:var(--text3)}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;box-shadow:var(--sh-lg)}
.demo-creds{background:var(--blue-l);border:1px solid #C7D0FF;border-radius:10px;padding:14px;margin-bottom:20px;font-size:12px}
.demo-creds strong{display:block;color:var(--blue-d);margin-bottom:6px;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.demo-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;color:var(--text2)}
.demo-row:last-child{margin-bottom:0}
.demo-row b{color:var(--text);font-family:monospace;font-size:11px}
.err-box{background:var(--red-l);border:1px solid #fda29b;border-radius:8px;padding:10px 12px;font-size:13px;color:var(--red-d);margin-bottom:14px;display:none}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">
    <img src="/mr-diy-logo.png" alt="MR DIY Logo">
    <div class="login-title">AttendFix</div>
    <div class="login-sub">MR DIY · HR Attendance Correction System</div>
  </div>
  <div class="login-card">
    <div class="demo-creds">
      <strong>🎮 Demo accounts</strong>
      <div class="demo-row"><span>Employee</span><b>employee@mrdiy.com / emp123</b></div>
      <div class="demo-row"><span>HOD</span><b>hod@mrdiy.com / hod123</b></div>
      <div class="demo-row"><span>HR</span><b>hr@mrdiy.com / hr123</b></div>
    </div>
    <div class="err-box" id="errBox"></div>
    <div class="form-group">
      <label class="label">Email address</label>
      <input type="email" class="input" id="email" placeholder="you@mrdiy.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label class="label">Password</label>
      <input type="password" class="input" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:4px" id="loginBtn" onclick="doLogin()">Sign in →</button>
  </div>
</div>
<script>
document.getElementById('password').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
async function doLogin() {
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('errBox');
  btn.disabled = true; btn.textContent = 'Signing in…';
  err.style.display = 'none';
  try {
    const r = await fetch('/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
    });
    const d = await r.json();
    if (!r.ok) { err.textContent = d.error; err.style.display='block'; btn.disabled=false; btn.textContent='Sign in →'; return; }
    window.location.href = d.redirect || '/dashboard';
  } catch(e) { err.textContent='Network error. Please try again.'; err.style.display='block'; btn.disabled=false; btn.textContent='Sign in →'; }
}
</script>
</body>
</html>
