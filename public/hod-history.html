<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><link rel="icon" type="image/png" href="/favicon.png"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AttendFix — MR DIY</title><link rel="stylesheet" href="/css/app.css">
<style>
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--blue-l)}
.detail-row{display:flex;gap:8px;margin-bottom:12px}
.detail-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);min-width:110px;padding-top:2px}
.detail-val{font-size:13px;color:var(--text);line-height:1.6}
.detail-sep{border:none;border-top:1px solid var(--border);margin:14px 0}
</style>
</head>
<body>
<div class="app"><nav class="sidebar" id="sidebar"></nav>
<div class="main-content"><div class="page-body">
  <div class="page-title">Approval history</div>
  <div class="page-sub" id="pageSub">Click any row to view full details</div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-body" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <select class="input" id="filterStatus" style="width:140px">
        <option value="">All statuses</option>
        <option value="PENDING">Pending</option>
        <option value="APPROVED">Approved</option>
        <option value="REJECTED">Rejected</option>
      </select>
      <input type="date" class="input" id="filterFrom" style="width:150px">
      <input type="date" class="input" id="filterTo" style="width:150px">
      <button class="btn btn-ghost btn-sm" onclick="load()">Filter</button>
      <button class="btn btn-ghost btn-sm" onclick="clearFilters()">Clear</button>
      <span id="totalCount" style="margin-left:auto;font-size:12px;color:var(--text3)"></span>
    </div>
  </div>

  <div class="card"><div class="card-body" style="padding:0"><div id="root"><div class="loading">Loading…</div></div></div></div>
</div></div></div>

<!-- Detail modal -->
<div class="overlay" id="detailModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">Request Details</div>
      <div class="modal-sub" id="modalSub"></div>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal('detailModal')">Close</button>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
let allRows = [];
let currentUser = null;

function showDetail(id) {
  const r = allRows.find(x => x.id === id);
  if (!r) return;
  const isHR = currentUser && ['HR','ADMIN'].includes(currentUser.role);
  const statusColor = r.status === 'APPROVED' ? 'var(--green-d)' : r.status === 'REJECTED' ? 'var(--red-d)' : 'var(--amber-d)';

  document.getElementById('modalTitle').textContent = `Correction — ${fmtDate(r.date)}`;
  document.getElementById('modalSub').textContent = `${r.employee_name||''} · ${(r.field_missing||'').replace('_',' ')}`;

  document.getElementById('modalBody').innerHTML = `
    <div class="detail-row">
      <span class="detail-lbl">Status</span>
      <span class="detail-val">${statusBadge(r.status)}</span>
    </div>
    ${isHR ? `<div class="detail-row"><span class="detail-lbl">Department</span><span class="detail-val">${r.department||'—'}</span></div>` : ''}
    <div class="detail-row">
      <span class="detail-lbl">Employee</span>
      <span class="detail-val" style="font-weight:600">${r.employee_name||'—'} <span style="font-size:11px;color:var(--text3)">${r.staff_id||''}</span></span>
    </div>
    <div class="detail-row">
      <span class="detail-lbl">Date</span>
      <span class="detail-val">${fmtDate(r.date)}</span>
    </div>
    <div class="detail-row">
      <span class="detail-lbl">Missing field</span>
      <span class="detail-val">${(r.field_missing||'').replace('_',' ')}</span>
    </div>
    <div class="detail-row">
      <span class="detail-lbl">Proposed time</span>
      <span class="detail-val" style="font-family:monospace;font-size:16px;font-weight:700;color:var(--blue)">${r.proposed_time||'—'}</span>
    </div>
    <hr class="detail-sep">
    <div class="detail-row">
      <span class="detail-lbl">Justification</span>
      <span class="detail-val">${r.justification||'—'}</span>
    </div>
    ${r.evidence ? `<div class="detail-row"><span class="detail-lbl">Evidence</span><span class="detail-val">${r.evidence}</span></div>` : ''}
    <div class="detail-row">
      <span class="detail-lbl">Submitted</span>
      <span class="detail-val">${fmtDateTime(r.created_at)}</span>
    </div>
    ${r.status !== 'PENDING' ? `
    <hr class="detail-sep">
    <div class="detail-row">
      <span class="detail-lbl">Decided by</span>
      <span class="detail-val">${r.hod_name||'—'}</span>
    </div>
    <div class="detail-row">
      <span class="detail-lbl">Decided on</span>
      <span class="detail-val">${r.decided_at ? fmtDateTime(r.decided_at) : '—'}</span>
    </div>
    <div class="detail-row">
      <span class="detail-lbl">Remarks</span>
      <span class="detail-val" style="color:${statusColor}">${r.hod_remarks || (r.status === 'APPROVED' ? 'Approved — no remarks.' : '—')}</span>
    </div>` : ''}`;

  openModal('detailModal');
}

document.getElementById('detailModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal('detailModal');
});

async function load() {
  document.getElementById('root').innerHTML = '<div class="loading">Loading…</div>';
  const status = document.getElementById('filterStatus').value;
  const from   = document.getElementById('filterFrom').value;
  const to     = document.getElementById('filterTo').value;
  const params = new URLSearchParams();
  if (status) params.set('status', status);
  if (from)   params.set('from', from);
  if (to)     params.set('to', to);

  const data  = await api('GET', '/api/hod/corrections/all?' + params.toString());
  allRows     = Array.isArray(data) ? data : (data.rows || []);
  const total = Array.isArray(data) ? data.length : (data.total || 0);

  document.getElementById('totalCount').textContent = `${total} record${total !== 1 ? 's' : ''}`;

  const isHR = currentUser && ['HR','ADMIN'].includes(currentUser.role);
  if (isHR) document.getElementById('pageSub').textContent = 'All departments — click any row to view full details';

  if (!allRows.length) {
    document.getElementById('root').innerHTML = '<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">No requests found.</div></div>';
    return;
  }

  document.getElementById('root').innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Employee</th>
          ${isHR ? '<th>Department</th>' : ''}
          <th>Date</th>
          <th>Missing</th>
          <th>Proposed</th>
          <th>Submitted</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        ${allRows.map(r => `
          <tr class="clickable" onclick="showDetail(${r.id})">
            <td><div style="font-weight:600">${r.employee_name||'—'}</div><div style="font-size:11px;color:var(--text3)">${r.staff_id||''}</div></td>
            ${isHR ? `<td style="font-size:12px;color:var(--text3)">${r.department||'—'}</td>` : ''}
            <td>${fmtDate(r.date)}</td>
            <td>${(r.field_missing||'').replace('_',' ')}</td>
            <td style="font-family:monospace;font-weight:600">${r.proposed_time||'—'}</td>
            <td style="font-size:12px;color:var(--text3)">${fmtDateTime(r.created_at)}</td>
            <td>${statusBadge(r.status)}</td>
            <td style="color:var(--text3);font-size:12px">View →</td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

function clearFilters() {
  document.getElementById('filterStatus').value = '';
  document.getElementById('filterFrom').value = '';
  document.getElementById('filterTo').value = '';
  load();
}

(async () => {
  currentUser = await buildSidebar('hod-history');
  await load();
})();
</script>
</body></html>
