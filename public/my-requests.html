<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Requests — AttendFix</title><link rel="stylesheet" href="/css/app.css"></head>
<body>
<div class="app"><nav class="sidebar" id="sidebar"></nav>
<div class="main-content"><div class="page-body">
  <div class="page-title">My requests</div>
  <div class="page-sub">History of all your correction submissions</div>
  <div class="card"><div class="card-body" style="padding:0"><div id="root"><div class="loading">Loading…</div></div></div></div>
</div></div></div>
<script src="/js/app.js"></script>
<script>
(async () => {
  await buildSidebar('my-requests');
  const reqs = await api('GET', '/api/corrections');
  if (!reqs.length) {
    document.getElementById('root').innerHTML='<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">No requests yet.<br>Go to <a href="/my-attendance">My Attendance</a> to submit a correction.</div></div>';
    return;
  }
  document.getElementById('root').innerHTML = `
    <table>
      <thead><tr><th>Date</th><th>Missing</th><th>Proposed time</th><th>Justification</th><th>Submitted</th><th>HOD decision</th><th>Status</th></tr></thead>
      <tbody>
        ${reqs.map(r=>`
          <tr>
            <td style="font-weight:600">${fmtDate(r.date)}</td>
            <td>${r.fieldMissing.replace('_',' ')}</td>
            <td style="font-family:monospace;font-weight:600">${r.proposedTime}</td>
            <td style="max-width:200px;font-size:12px;color:var(--text2)">${r.justification.slice(0,60)}${r.justification.length>60?'…':''}</td>
            <td style="font-size:12px;color:var(--text3)">${fmtDateTime(r.createdAt)}</td>
            <td style="font-size:12px;color:var(--text2)">${r.hodRemarks?`<em>${r.hodRemarks.slice(0,50)}…</em>`:'—'}</td>
            <td>${statusBadge(r.status)}</td>
          </tr>`).join('')}
      </tbody>
    </table>`;
})();
</script>
</body></html>
